# nginx: sitio estático en pruebas.somfylabs.cloud
server {
    listen 80;
    listen [::]:80;
    server_name pruebas.somfylabs.cloud;

    root /var/www/pruebas.somfylabs.cloud;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg|png|jpg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
